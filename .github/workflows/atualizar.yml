name: Atualizar e publicar

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (UTC)
  workflow_dispatch:         # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Guarda os detalhes de lotes já baixados entre execuções
      - uses: actions/cache@v6
        with:
          path: cache
          key: lotes-${{ github.run_id }}
          restore-keys: lotes-

      - name: Coletar lotes
        run: python coletar.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Deploy em job separado: garante que o artifact já está finalizado
  # e visível na API antes do deploy-pages procurá-lo.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
